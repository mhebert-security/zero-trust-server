[package]
name = "zero-trust-server"
version = "0.1.0"
edition = "2024"

# The default build writes one TAB-delimited audit line per request on stdout
# (see src/audit.rs). structured-telemetry additionally mirrors each line as a
# single JSON object on stderr, with attribute names drawn from the
# OpenTelemetry semantic conventions. It stays off by default: the JSON copy
# is an opt-in feed for a telemetry pipeline, never the primary record.
[features]
default = []
structured-telemetry = []

# The dependency list stays deliberately small. rustls remains the exception
# for TLS: pure Rust, no OpenSSL, no C dependencies. rusqlite joins it for
# the cyber-news store on the same grounds — an embedded relational store is
# not tractable to hand-roll the way HTTP parsing, routing, session
# management, PoW challenge logic, and security headers are, and SQLite runs
# in-process with no server. Everything else is std only.
#
# The cyber-news fetcher (src/bin/cyber_news_fetcher.rs) stretches that rule
# in exactly two places, both outbound. quick-xml parses the RSS and Atom
# feeds, and webpki-roots supplies the Mozilla root set the fetcher verifies
# those https connections against. Each is a focused, well-audited crate
# where hand-rolling would cost more in correctness than it saves in
# surface. They are linked into the server binary too, but only because this
# package builds every target from one dependency set; the server code never
# calls them.
#
# prefer-post-quantum pins the aws-lc-rs crypto provider (it is a rustls
# default today, declared here so a future default change cannot silently
# drop the X25519MLKEM768 hybrid key exchange). The provider's default
# group list offers the hybrid first; tls.rs regression tests lock in that
# a PQ-capable client negotiates it.
[dependencies]
# XML events only; default features pull serialization and encoding
# detection, which the fetcher does not need (it decodes its feeds itself).
quick-xml = { version = "0.42.0", default-features = false }
# bundled compiles the SQLite amalgamation at build time, so the binary
# needs no system SQLite development package (matching the project's
# self-contained builds on the NixOS host).
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", features = ["prefer-post-quantum"] }
rustls-pemfile = "2.0"
# The client half of rustls needs a root store. webpki-roots ships Mozilla's
# set as static data in the same pki-types format rustls already uses, so the
# fetcher builds its RootCertStore from it with no filesystem dependency.
webpki-roots = "1.0.9"

# Test-only crates, never linked into the shipped binary.
# proptest drives property tests; sha2 and hmac are the independent, widely
# audited RustCrypto implementations used as oracles to differentially check
# the hand-rolled primitives in crypto.rs across arbitrary inputs. The SHA-256
# and HMAC-SHA256 property tests run 100,000 cases by default (PROPTEST_CASES
# lowers the count for MIRI).
#
# proptest is pulled without its default features: the `fork` and `timeout`
# features run cases in child processes and threads, which the MIRI
# interpreter cannot do. std-only runs every case in-process, which MIRI
# handles and which changes no property-test behavior.
[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
sha2 = "0.10"
hmac = "0.12"

[profile.release]
opt-level = "z"    # optimize for binary size
lto = true         # link-time optimization
panic = "abort"    # smaller binary, no unwinding overhead
strip = true       # strip debug symbols from release binary
